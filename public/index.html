<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
  <title>剧本工作台 · screenplay-web</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="剧本工作台" />
  <script>
    // 尽早确定主题，避免页面闪白
    (function () {
      var t = localStorage.getItem('theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <button class="icon-btn only-mobile" id="btn-menu" title="场景列表">☰</button>
    <div class="brand"><img src="favicon.svg" alt="" /><span>剧本工作台</span></div>
    <select class="script-select" id="script-select" title="切换剧本"></select>
    <button class="icon-btn" id="btn-script-menu" title="剧本设置">⚙</button>
    <div class="spacer"></div>
    <button class="btn" id="btn-full" title="按顺序预览全部场景">全本</button>
    <button class="btn only-desktop" id="btn-compare" title="左右对比两个场景">对比</button>
    <button class="btn primary" id="btn-new" title="新建场景">＋ 场景</button>
    <button class="icon-btn" id="btn-theme" title="切换浅色 / 深色">☾</button>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="side-section">
        <div class="side-title">场景</div>
        <ul class="file-list" id="list-scenes"></ul>
      </div>
      <div class="side-section">
        <div class="side-title">笔记</div>
        <ul class="file-list" id="list-notes"></ul>
      </div>
      <div class="side-footer">
        <button class="side-link" id="btn-log" title="这个剧本的修改记录">🕘 修改历史</button>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="panes" id="panes"></main>
  </div>

  <div class="sheet-mask" id="sheet" hidden>
    <div class="sheet">
      <div class="sheet-title"></div>
      <div class="sheet-actions"></div>
    </div>
  </div>

  <template id="tpl-pane">
    <section class="pane">
      <div class="pane-head">
        <div class="pane-title"></div>
        <div class="seg">
          <button data-mode="preview">预览</button>
          <button data-mode="edit">编辑</button>
          <button data-mode="split" class="only-wide">分屏</button>
        </div>
        <span class="save-state"></span>
        <button class="icon-btn pane-close only-desktop" title="关闭这一栏">✕</button>
      </div>
      <div class="conflict" hidden>
        <span>这个文件在别处被改过了（可能是 AI 或其他工具改的）</span>
        <button data-act="theirs">载入新版本</button>
        <button data-act="mine">保留我的并覆盖</button>
      </div>
      <div class="pane-body">
        <div class="editor-wrap">
          <div class="toolbar" role="toolbar" aria-label="剧本格式">
            <button data-fmt="scene" title="新场景：场次 时间 内/外 地点">🎬 场景</button>
            <button data-fmt="action" title="动作、画面描写">📝 动作</button>
            <button data-fmt="character" title="角色说话：角色名 + 台词">🗣 角色台词</button>
            <button data-fmt="paren" title="台词里的语气、小动作，放在角色名和台词之间">( ) 语气</button>
            <button data-fmt="dual" title="和上一句台词同时说，左右并排显示">⇆ 同时说</button>
            <button data-fmt="transition" title="转场，靠右显示">➡ 转场</button>
            <button data-fmt="centered" title="居中文字，比如字幕、时间提示">≡ 居中</button>
            <button data-fmt="lyrics" title="歌词，斜体显示">♪ 歌词</button>
            <span class="tb-sep"></span>
            <button data-fmt="bold" title="粗体"><b>B</b></button>
            <button data-fmt="italic" title="斜体"><i>I</i></button>
            <button data-fmt="underline" title="下划线"><u>U</u></button>
            <span class="tb-sep"></span>
            <button data-fmt="note" title="写给自己的备注，预览里黄色高亮，正式剧本不显示">💬 备注</button>
            <button data-fmt="section" title="幕/段落标记，只在编辑时看，不出现在预览里">📑 分幕</button>
            <button data-fmt="synopsis" title="这一段的内容提要，只在编辑时看">✎ 提要</button>
            <button data-fmt="pagebreak" title="强制分页">✂ 分页</button>
            <button data-fmt="title" title="在开头加标题页：剧名、作者">📄 标题页</button>
            <span class="tb-sep"></span>
            <button data-fmt="help" class="tb-help fountain-only" title="格式说明">？</button>
            <button data-fmt="md-h" class="md-only" title="小标题">H 标题</button>
            <button data-fmt="md-list" class="md-only" title="无序列表">• 列表</button>
            <button data-fmt="md-olist" class="md-only" title="有序列表">1. 编号</button>
            <button data-fmt="md-quote" class="md-only" title="引用">❝ 引用</button>
            <button data-fmt="md-table" class="md-only" title="表格，比如人物表">▦ 表格</button>
            <button data-fmt="md-hr" class="md-only" title="分隔线">— 分隔线</button>
          </div>
          <div class="cheatsheet" hidden></div>
          <textarea class="editor" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
        </div>
        <div class="preview"><div class="page"></div></div>
      </div>
    </section>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
